# Nixpacks configuration for Railway
# This file tells Railway to build from the backend directory
# IMPORTANT: Also set Root Directory to 'backend' in Railway service Settings tab

[providers]
node = "18"

[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = ["cd backend && npm install"]

[start]
cmd = "cd backend && npm start"

